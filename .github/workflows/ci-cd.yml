# ============================================================
# CI/CD : Chat AI + Portfolio (BE + FE) บน GitHub Actions
#
# ทุก push และทุก Pull Request เข้า main : test-be, test-fe
#   - test-be : ตรวจ syntax ของ BE, สตาร์ทเซิร์ฟเวอร์ยิง /health แล้วรันเทสต์ (api.test.js)
#   - test-fe : ติดตั้ง package แล้ว build FE ถ้า build พังจะขึ้นสีแดง
#
# BE กับ FE แยกสายกัน ถ้าฝั่งหนึ่งพัง อีกฝั่งยังรันต่อได้
#
# push เข้า main และเทสต์ผ่านทั้งสองฝั่ง : deploy-be สั่ง Render deploy BE ด้วย Deploy Hook
#
# ยังไม่มี (ทำทีหลังถ้ามีเวลา)
#   - deploy FE ขึ้น Render
#   - build Docker image และ push ขึ้น Docker Hub
#
# ไฟล์นี้ขึ้น GitHub สาธารณะ ห้ามใส่ key จริงลงไป
# ค่าลับทั้งหมดต้องเก็บที่ GitHub -> Settings -> Secrets and variables -> Actions
#   Secrets
#     RENDER_DEPLOY_HOOK_BE   Deploy Hook URL ของ BE บน Render
# ============================================================

# ชื่อที่แสดงในแท็บ Actions ของ GitHub
name: CI/CD

# เมื่อไหร่ที่ให้ pipeline ทำงาน
on:
  push:
    branches: [main]      # ทุกครั้งที่ push เข้า main
  pull_request:
    branches: [main]      # ทุกครั้งที่เปิด Pull Request เข้า main
  workflow_dispatch:      # กดรันเองได้จากแท็บ Actions

# ให้ token ของ workflow อ่าน repo ได้อย่างเดียว (ปลอดภัยกว่าค่าเริ่มต้น)
permissions:
  contents: read

jobs:
  # ================= BACKEND =================

  # ---------- ตรวจฝั่ง Backend ----------
  test-be:
    runs-on: ubuntu-latest        # เครื่อง Linux ที่ GitHub ให้ใช้ฟรี
    defaults:
      run:
        working-directory: BE     # ทุกคำสั่งใน job นี้รันในโฟลเดอร์ BE
    steps:
      # ดึงโค้ดจาก repo มาไว้ในเครื่องที่ใช้รัน pipeline
      - uses: actions/checkout@v4

      # ติดตั้ง Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                             # เก็บ cache ของ package ให้รอบต่อไปเร็วขึ้น
          cache-dependency-path: BE/package-lock.json

      # ติดตั้ง package ตาม package-lock.json แบบเป๊ะ (ต่างจาก npm install ที่อาจอัปเดตเวอร์ชัน)
      - run: npm ci

      # ตรวจว่า index.js เขียนถูกไวยากรณ์ (ไม่ได้รันจริง จับพวกวงเล็บขาดหรือพิมพ์ผิดได้)
      - name: ตรวจ syntax
        run: node --check index.js

      # สตาร์ทเซิร์ฟเวอร์จริงแล้วยิง /health เพื่อเช็กว่าขึ้นได้
      - name: สตาร์ทเซิร์ฟเวอร์และทดสอบ /health
        env:
          # ค่าปลอม ใช้ได้เพราะ /health ไม่แตะฐานข้อมูลหรือ Gemini
          # ห้ามเอา key จริงมาใส่ตรงนี้
          GEMINI_API_KEY: dummy
          GEMINI_MODEL: dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          PORT: 3000
        run: |
          node index.js &                              # เปิดเซิร์ฟเวอร์ทิ้งไว้เบื้องหลัง
          sleep 5                                      # รอ 5 วินาทีให้เซิร์ฟเวอร์เริ่มทำงาน
          curl --fail http://localhost:3000/health     # ถ้าไม่ได้ 200 job นี้จะแดง

      # รันเทสต์อัตโนมัติ (ไฟล์ *.test.js ในโฟลเดอร์ BE)
      # ถ้ามีเทสต์ใดล้ม job นี้จะแดง และ deploy-be จะไม่ถูกสั่ง
      - name: รันเทสต์
        env:
          # ค่าปลอม ห้ามใส่ key จริง เพราะไฟล์นี้ขึ้น GitHub สาธารณะ
          GEMINI_API_KEY: dummy
          GEMINI_MODEL: dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        # บน GitHub ไม่มี test-db.js และ test-gemini.js (ไม่ได้ commit) จึงเจอแต่ api.test.js
        run: node --test

  # ================= FRONTEND =================

  # ---------- ตรวจฝั่ง Frontend ----------
  test-fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE     # ทุกคำสั่งใน job นี้รันในโฟลเดอร์ FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - run: npm ci

      # รัน test ถ้ามีสคริปต์ test ใน package.json (ไม่มีก็ข้าม ไม่พัง)
      - run: npm test --if-present

      # build FE ผ่าน = React compile ได้ ไม่มี error
      - run: npm run build

  # ================= DEPLOY =================

  # ---------- deploy BE ขึ้น Render ----------
  deploy-be:
    # รอให้ test-be และ test-fe ผ่านทั้งคู่ก่อน ถ้าตัวใดตัวหนึ่งแดงจะไม่ deploy
    needs: [test-be, test-fe]
    # deploy เฉพาะตอน push เข้า main เท่านั้น (Pull Request จะไม่ deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # เรียก Deploy Hook ของ Render เพื่อสั่งให้ build และ deploy ใหม่
      # -f ทำให้ job แดงถ้า Render ตอบ error  -sS ซ่อนความคืบหน้าแต่ยังแสดง error
      - name: สั่ง Render deploy BE
        run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          # ดึงค่าจาก GitHub Secrets ค่านี้จะถูกซ่อนใน log
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BE }}