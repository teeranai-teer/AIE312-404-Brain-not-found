<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 Brain Not Found | สำนักงานสืบสวน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Sarabun:wght@400;600;700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
/* --vh = 1% ของความสูงจอที่มองเห็นจริง (มือถือ: ไม่นับแถบที่อยู่เบราว์เซอร์) */
:root{--vh:1vh}
@supports (height:1dvh){:root{--vh:1dvh}}
/* ===== ตัวแปรหลัก =====
   --sw / --sh = ขนาดของ "เวที" 16:9 ที่ขยายแบบ cover (เหมือน object-fit: cover)
   ทำให้ปุ่มและกล่อง UI ที่วางด้วยเปอร์เซ็นต์ของภาพ อยู่ตรงตำแหน่งในภาพเสมอ ไม่ว่าจอสัดส่วนไหน */
:root{
  --sw:min(max(100vw,calc(var(--vh)*177.7778)),calc(var(--vh)*247));  /* ขยายแบบ cover แต่จำกัดไม่ให้ครอปเกิน ~28% บนจอกว้างพิเศษ (ที่เหลือเป็นแถบมืดข้างๆ) */
  --sh:calc(var(--sw)*.5625);
  --ex:max(0px,calc(var(--sh) - calc(var(--vh)*100)));   /* ส่วนของภาพที่เกินจอในแนวตั้ง */
  --ox:calc(50vw - var(--sw)/2);           /* จุดเริ่มแนวนอนของเวที */
  --oy:calc(var(--ex)*-.36);               /* ตัดด้านบนแค่ 36% ของส่วนเกิน เพื่อให้เห็นหน้า/หมวกนักสืบมากกว่าโต๊ะ */
  --ink:#3a2410;
  --ink-soft:#5a3d22;
  --paper:rgba(226,198,148,.86);
  --brass:#c9a24b;
  --dark:#0d0906;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dark);overflow:hidden;font-family:'Special Elite','Sarabun',serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}

/* ===== ชั้นวิดีโอ/ภาพ ซ้อนกันทั้งหมด สลับด้วย opacity เพื่อไม่ให้จอดำ ===== */
.layer{position:fixed;left:var(--ox);top:var(--oy);width:var(--sw);height:var(--sh);object-fit:cover;opacity:0;transition:opacity .9s ease;pointer-events:none;background:var(--dark)}
.layer.on{opacity:1}

/* ===== จอโหลดแรกเข้า ===== */
#loader{position:fixed;inset:0;z-index:1000;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#d9c08a;transition:opacity .6s;font-size:18px;letter-spacing:.06em}
#loader.hide{opacity:0;pointer-events:none}
#loader .bar{width:160px;height:2px;background:#3a2c1c;overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:var(--brass);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ===== ปุ่มควบคุมบนหน้าจอ (Back / Sound / Skip) ===== */
.ctl{position:fixed;z-index:60;background:rgba(18,11,6,.72);color:#ecd9ac;border:1px solid rgba(201,162,75,.7);border-radius:999px;padding:.55em 1.1em;font-size:clamp(13px,1.05vw,17px);letter-spacing:.03em;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s,background .2s}
.ctl:hover{background:rgba(60,38,16,.9)}
.ctl:focus-visible,.hot:focus-visible,.tab:focus-visible,.qp:focus-visible,.send:focus-visible{outline:2px solid #fff3c4;outline-offset:3px}
#back{left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top))}
#sound{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top))}
#skip{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}
#sound{opacity:1;pointer-events:auto}
body[data-scene="chat"] #back,body[data-scene="profile"] #back,body[data-scene="wanted"] #back{opacity:1;pointer-events:auto}
body[data-scene="intro"] #skip,body[data-scene="tag2"] #skip{opacity:1;pointer-events:auto}

/* ===== แบนเนอร์ต้อนรับ (หน้าเมนู) ===== */
#banner{position:fixed;left:0;right:0;top:0;z-index:50;padding:clamp(16px,calc(var(--vh)*2.6),30px) 70px clamp(30px,calc(var(--vh)*5),56px);text-align:center;background:linear-gradient(to bottom,rgba(10,6,3,.82),rgba(10,6,3,0));color:#efdcaf;font-family:'Special Elite','Sarabun',serif;font-size:clamp(14px,1.6vw,26px);letter-spacing:.04em;text-shadow:0 2px 8px #000;opacity:0;pointer-events:none;transition:opacity .8s .25s}
body[data-scene="menu"] #banner{opacity:1}

/* ===== ปุ่ม Hotspot บนภาพเมนู ===== */
.hot{position:fixed;z-index:55;left:calc(var(--ox) + var(--sw)*var(--x));top:clamp(70px,calc(var(--oy) + var(--sh)*var(--y)),calc(calc(var(--vh)*100) - 70px));transform:translate(-50%,-50%) scale(.96);display:flex;align-items:center;gap:.7em;max-width:min(22em,86vw);padding:.7em 1.15em .7em .9em;background:linear-gradient(180deg,rgba(40,24,10,.88),rgba(20,12,5,.9));color:#f3e2b6;border:1.5px solid var(--brass);border-radius:10px;font-size:clamp(13px,1.15vw,19px);line-height:1.35;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .7s .35s,transform .25s,background .2s}
body[data-scene="menu"] .hot{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
body[data-scene="menu"] .hot:hover{transform:translate(-50%,-50%) scale(1.05);background:linear-gradient(180deg,rgba(80,50,20,.95),rgba(36,22,9,.95))}
.hot .dot{flex:none;width:.95em;height:.95em;border-radius:50%;background:var(--brass);box-shadow:0 0 0 0 rgba(201,162,75,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 .8em rgba(201,162,75,0)}100%{box-shadow:0 0 0 0 rgba(201,162,75,0)}}
.hot small{display:block;opacity:.75;font-size:.78em;letter-spacing:.03em}
/* ปุ่มแบบรูปภาพ (ถามนักสืบ / ประวัติของนักสืบ) */
.hot.img{padding:0;background:none;border:0;border-radius:0;box-shadow:none;width:clamp(210px,calc(var(--sw)*.21),460px);max-width:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65));animation:hotglow 2.6s ease-in-out infinite alternate}
.hot.img img{display:block;width:100%;height:auto;pointer-events:none}
body[data-scene="menu"] .hot.img:hover{background:none;filter:drop-shadow(0 0 18px rgba(245,195,95,.85)) brightness(1.1)}
@keyframes hotglow{from{filter:drop-shadow(0 8px 16px rgba(0,0,0,.65))}to{filter:drop-shadow(0 0 14px rgba(245,195,95,.55)) drop-shadow(0 8px 16px rgba(0,0,0,.5))}}
.hot.img:hover{animation:none}

/* ===== กล่องข้อมูลซ้อนบนกระดาษ ===== */
.panel{--h:min(calc(var(--sh)*var(--ph)),calc(var(--vh)*88));position:fixed;z-index:56;left:calc(var(--ox) + var(--sw)*var(--cx));top:clamp(calc(var(--h)/2 + 8px),calc(var(--oy) + var(--sh)*var(--cy)),calc(calc(var(--vh)*100) - var(--h)/2 - 8px));width:min(calc(var(--sw)*var(--pw)),94vw);height:var(--h);transform:translate(-50%,-50%);display:flex;flex-direction:column;padding:clamp(14px,2vw,34px);background:var(--paper);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border-radius:6px;box-shadow:inset 0 0 40px rgba(110,70,25,.28),0 6px 30px rgba(0,0,0,.35);font-size:clamp(14px,calc(var(--sw)*.0098),19px);line-height:1.5;opacity:0;pointer-events:none;transition:opacity .8s}
.panel.open{opacity:1;pointer-events:auto}
#panel-chat{--cx:.507;--cy:.5;--pw:.46;--ph:.92}
/* หน้าแชตเขียนลงบนกระดาษโดยตรง ไม่มีกล่องสี่เหลี่ยม และตัวอักษรใหญ่ขึ้น (16–20px) */
#panel-chat{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border-radius:0;font-size:clamp(18px,calc(var(--sw)*.0128),23px)}
#panel-chat .m{font-size:1em}
#panel-chat .m.ai{background:#fffdf7;border-color:rgba(90,61,34,.3);box-shadow:0 1px 3px rgba(58,36,16,.15)}
/* แถวข้อความ + รูปโปรไฟล์ (AI ซ้าย, ผู้ถามขวา) */
.row{display:flex;align-items:flex-end;gap:.55em;max-width:94%}
.row.ai{align-self:flex-start}
.row.me{align-self:flex-end}
.row .m{max-width:none;min-width:0;align-self:auto}
.av{flex:none;width:2.5em;height:2.5em;border-radius:50%;object-fit:cover;border:2px solid #b9873f;box-shadow:0 2px 5px rgba(0,0,0,.3);background:#3a2410}
.av.me{display:flex;align-items:center;justify-content:center}
.av.me svg{width:60%;height:60%;fill:#f3e2b6}
#panel-chat .qp,#panel-chat .form input,#panel-chat .send,#panel-chat .case button{font-size:.9em}
#panel-chat .newcase{font-size:.78em;white-space:nowrap}
#panel-chat .sub{font-size:.85em}

/* ===== โครงหน้าแชตแบบใหม่ (หัวป้ายทอง / ฟองข้อความมีรูป+เวลา / แถบพิมพ์กรอบทอง) ===== */
.chat-head{display:flex;align-items:center;justify-content:center;margin:0 auto .75em}
.medal{flex:none;position:relative;z-index:2;width:4.4em;height:4.4em;margin-right:-1.5em;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.plaque{display:flex;flex-direction:column;align-items:center;padding:.35em 1.4em .45em 2.1em;background:linear-gradient(180deg,#4f3016,#28150a);border:3px solid #c9973e;outline:1.5px solid #f0cd7a;outline-offset:-7px;border-radius:14px;box-shadow:0 4px 10px rgba(40,20,5,.45),inset 0 0 14px rgba(0,0,0,.6)}
.plaque span{font-family:'Mali','Sarabun',cursive;font-weight:700;line-height:1.2;padding:.18em .06em .26em;filter:drop-shadow(0 2px 1px rgba(0,0,0,.85));background:linear-gradient(180deg,#fff2bd,#f2c75d 55%,#b9832a);-webkit-background-clip:text;background-clip:text;color:transparent}
.plaque .l1{font-size:1.75em;line-height:1.55}
.plaque .l2{font-size:1.35em;letter-spacing:.01em;white-space:nowrap}
#panel-chat .row{align-items:flex-start;gap:.6em;max-width:96%}
#panel-chat .row.ai .av{width:3.3em;height:3.3em;border:3px solid #c9973e}
#panel-chat .av.me{width:3em;height:3em;border:3px solid #c9973e;background:radial-gradient(circle at 50% 30%,#7a4a1c,#2a160a 75%)}
#panel-chat .av.me svg{fill:#f5d27a}
#panel-chat .m{border-radius:18px;padding:.6em .95em;line-height:1.55}
#panel-chat .m.ai{background:linear-gradient(180deg,#fffdf6,#fbf1d9);border:2px solid #d8b97c;border-top-left-radius:5px;box-shadow:0 3px 8px rgba(60,35,10,.22)}
#panel-chat .m.me{background:linear-gradient(180deg,#5c3519,#341b0a);color:#f5dfa5;border:2px solid #c9973e;border-top-right-radius:5px;box-shadow:0 3px 8px rgba(40,20,5,.35);font-weight:600}
#panel-chat .m.typing{background:#fffaf0}
.ts{flex:none;align-self:flex-end;font-size:.66em;color:#5e4528;white-space:nowrap;padding-bottom:.25em}
.num{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;margin:.12em .45em .12em 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a4a1c,#3a2008);border:2px solid #c9973e;color:#f5d27a;font-weight:700;font-size:.85em;vertical-align:middle}
#panel-chat .form{align-items:center;gap:.5em;margin-top:.35em;padding:.4em .45em .4em .5em;background:linear-gradient(180deg,#4f3016,#24130a);border:3px solid #c9973e;border-radius:999px;box-shadow:0 4px 12px rgba(40,20,5,.45),inset 0 0 10px rgba(0,0,0,.5)}
.form-ico{flex:none;width:2.3em;height:2.3em;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6b3f18,#2a160a);border:2px solid #c9973e}
.form-ico svg{width:62%;height:62%;fill:#f5d27a}
#panel-chat .form input{background:linear-gradient(180deg,#fbf4e2,#efe1c0);border:2px solid #b98b45;border-radius:999px;padding:.5em 1em;color:#2f1c0b}
#panel-chat .form input:focus{background:#fffaf0;box-shadow:0 0 0 2px #f0cd7a}
#panel-chat .send{flex:none;width:2.6em;height:2.6em;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe593,#c9973e 60%,#8a5a1a);border:2px solid #f0cd7a;box-shadow:0 2px 6px rgba(0,0,0,.45)}
#panel-chat .send svg{width:55%;height:55%;fill:#3a2008;margin-left:-8%}
#panel-chat .send:hover{filter:brightness(1.08)}
.panel h2{margin:0 0 .15em;font-family:'Mali','Sarabun',cursive;font-weight:700;font-size:1.45em;color:#2f1c0b;text-align:center;letter-spacing:.02em}
.panel .sub{text-align:center;font-size:.8em;color:var(--ink-soft);margin-bottom:.6em;border-bottom:1px solid rgba(90,61,34,.45);padding-bottom:.5em}

/* ===== ห้องแชต ===== */
.msgs{flex:1;overflow-y:auto;padding:.2em .3em .2em 0;display:flex;flex-direction:column;gap:.55em;scrollbar-width:thin;scrollbar-color:#8a6a3c transparent}
.m{max-width:88%;padding:.45em .75em;border-radius:8px;font-family:'Sarabun','Special Elite',serif;font-size:.95em;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
.m.ai{align-self:flex-start;background:rgba(255,248,226,.5);border:1px solid rgba(90,61,34,.35)}
.m.me{align-self:flex-end;background:rgba(58,36,16,.88);color:#f6e8c3}
.m.err{align-self:center;background:rgba(150,40,30,.15);border:1px solid rgba(150,40,30,.55);color:#6a1d14;text-align:center}
.m.typing{opacity:.75;font-style:italic}
.chatwrap{flex:1;min-height:0;display:flex;gap:.9em}
.side{flex:none;width:32%;max-width:13em;display:flex;flex-direction:column;gap:.55em;min-height:0;padding-right:.85em;border-right:1px solid rgba(90,61,34,.4)}
.side h4{align-self:flex-start;margin:.2em 0 0;padding:.3em .8em;background:linear-gradient(180deg,#4f3016,#28150a);border:1.5px solid #c9973e;border-radius:6px;font-family:'Special Elite','Sarabun',serif;font-weight:700;font-size:.85em;letter-spacing:.1em;color:#f5d27a;box-shadow:0 2px 5px rgba(40,20,5,.35)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.caselist{flex:1;min-height:0;display:flex;flex-direction:column;gap:.4em;overflow-y:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:#8a6a3c transparent}
.case{flex:none;display:flex;gap:.3em}
.case button{background:rgba(255,248,226,.32);border:1px solid rgba(58,36,16,.5);color:var(--ink);font-family:'Sarabun',serif;font-size:.82em;line-height:1.35;border-radius:8px}
.case.on .case-open{background:var(--ink);border-color:var(--ink);color:#f3e2b6}
.case-open{flex:1;min-width:0;padding:.4em .65em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-open b{display:block;font-family:'Special Elite','Sarabun',serif;font-weight:400;font-size:.8em;letter-spacing:.06em;opacity:.75}
.case-del{flex:none;width:2.1em;padding:0}
.case-del:hover{background:rgba(150,40,30,.22)}
.newcase{width:100%;background:linear-gradient(180deg,#e9c98a,#c99a52);border:0;color:#2f1c0b;border-radius:999px;padding:.55em .8em;font-size:.85em;font-family:'Sarabun',serif;font-weight:700;box-shadow:0 2px 6px rgba(58,36,16,.3)}
.newcase:hover{filter:brightness(1.06)}
.side button:disabled{opacity:.45;cursor:default}

/* ===== ฉากหน้าประตู: ข้อความเชิญชวน + ปุ่มเปิดประตู ===== */
#gate{position:fixed;left:0;right:0;bottom:0;z-index:58;padding:calc(var(--vh)*10) 20px max(calc(var(--vh)*8),env(safe-area-inset-bottom));text-align:center;background:linear-gradient(to top,rgba(8,5,3,.94),rgba(8,5,3,.62) 62%,rgba(8,5,3,0));color:#efdcaf;opacity:0;pointer-events:none;transition:opacity .9s}
body[data-scene="door"] #gate{opacity:1;pointer-events:auto}
#gate .kicker{margin:0 0 .6em;font-family:'Special Elite','Sarabun',serif;letter-spacing:.22em;font-size:clamp(11px,.9vw,14px);color:var(--brass)}
#gate h1{margin:0 auto .45em;max-width:22em;font-family:'Mali','Sarabun',cursive;font-weight:700;font-size:clamp(22px,2.7vw,44px);line-height:1.3;color:#f6e6bd;text-shadow:0 3px 12px #000}
#gate p.lead{margin:0 auto 1.4em;max-width:38em;font-family:'Sarabun',serif;font-size:clamp(14px,1.15vw,19px);line-height:1.6;color:#d9c69c}
/* ปุ่มเปิดประตูเป็นรูปภาพ */
#enter{background:none;border:0;padding:0;width:min(640px,88vw);filter:drop-shadow(0 8px 18px rgba(0,0,0,.7));animation:doorglow 2.4s ease-in-out infinite alternate;transition:transform .2s}
#enter img{display:block;width:100%;height:auto;pointer-events:none}
#enter:hover{transform:scale(1.04);animation:none;filter:drop-shadow(0 0 20px rgba(245,195,95,.9)) brightness(1.08)}
#enter:focus-visible{outline:2px solid #fff3c4;outline-offset:6px}
@keyframes doorglow{from{filter:drop-shadow(0 8px 18px rgba(0,0,0,.7))}to{filter:drop-shadow(0 0 18px rgba(245,195,95,.6)) drop-shadow(0 8px 18px rgba(0,0,0,.6))}}
/* ปุ่มย้อนกลับเป็นรูปภาพ */
#back.imgbtn{padding:0;background:none;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;width:clamp(120px,10vw,190px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#back.imgbtn img{display:block;width:100%;height:auto;pointer-events:none}
#back.imgbtn:hover{background:none;filter:drop-shadow(0 0 12px rgba(245,195,95,.8)) brightness(1.08)}
/* หน้าเริ่ม: แตะครั้งเดียวเพื่อเริ่มพร้อมเสียง */
/* ภาพเมืองวางแบบเดียวกับฉากอื่น (cover) เพื่อให้แว่นขยายอยู่ตรงอาคารเดิมทุกขนาดจอ */
#loader .startbg{position:fixed;left:var(--ox);top:var(--oy);width:var(--sw);height:var(--sh);object-fit:cover}
#loader .bar{position:relative}
#begin{position:fixed;left:calc(var(--ox) + var(--sw)*.515);top:calc(var(--oy) + var(--sh)*.713);translate:-50% -50%;background:none;border:0;padding:0;width:clamp(80px,calc(var(--sw)*.06),150px);filter:drop-shadow(0 10px 22px rgba(0,0,0,.75));animation:beginpulse 2.4s ease-in-out infinite;transition:transform .25s}
#begin img{display:block;width:100%;height:auto;pointer-events:none}
#begin:hover{animation:none;transform:rotate(-8deg) scale(1.07);filter:drop-shadow(0 0 26px rgba(245,195,95,.9))}
@keyframes beginpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#begin:focus-visible{outline:2px solid #fff3c4;outline-offset:4px}
#loader.ready .bar{display:none}
.qps{display:flex;flex-wrap:wrap;gap:.45em;margin:.55em 0 .4em}
.qp{background:#fff6df;border:2px solid #8a5a2a;color:#2f1c0b;font-weight:600;box-shadow:0 2px 5px rgba(40,20,5,.25);border-radius:999px;padding:.3em .85em;font-size:.82em;font-family:'Sarabun',serif;transition:background .2s}
.qp:hover{background:#3a2410;color:#f5d27a;border-color:#c9973e}
.qp:disabled{opacity:.45;cursor:default}
.form{display:flex;gap:.5em;margin-top:.2em}
.form input{flex:1;min-width:0;background:rgba(255,250,235,.55);border:0;border-bottom:2px solid rgba(58,36,16,.75);padding:.5em .6em;font-size:.95em;font-family:'Sarabun','Special Elite',serif;color:var(--ink);border-radius:3px 3px 0 0}
.form input::placeholder{color:#7a5d3a}
.form input:focus{outline:none;background:rgba(255,250,235,.85)}

<script>
/* ============ ตั้งค่า ============ */
// ที่อยู่ Backend (แก้ได้ที่เดียว) ถ้าฝังในเว็บเดียวกับ FE บน Render จะผ่าน CORS ตามปกติ
const API_URL = window.STORY_API_URL || 'https://aie312-404-brain-not-found-be.onrender.com';
const MOCK = new URLSearchParams(location.search).has('mock'); // ?mock=1 = ไม่เรียก BE จริง (ไว้ดูหน้าตา)
const FADE_MS = 900;       // ต้องเท่ากับ transition ของ .layer
const WATCHDOG_MS = 8000;
const RATE = {};               // ไม่เร่งในเบราว์เซอร์ (chat.mp4 ถูกทำให้เร็ว 2.6 เท่าไว้ในไฟล์แล้ว ยาวประมาณ 2.3 วินาที)
const EARLY = { chat: 0.3, profile: 0.3 };  // เปิดกล่องแชตก่อนวิดีโอจบ 0.3 วินาที ให้เฟดซ้อนกันพอดี  // วิดีโอไม่เริ่มเล่นภายในเวลานี้ = ข้ามไปฉากถัดไป กันค้างจอ

/* ============ สถานะ ============ */
const $ = (id) => document.getElementById(id);
const layers = { intro:$('v-intro'), tag2:$('v-tag2'), menu:$('v-menu'), chat:$('v-chat'), chatbg:$('v-chatbg'), profile:$('v-profile'), profilebg:$('v-profilebg'), wanted:$('v-wanted') };
const NEXT = { tag2:'door', intro:'menu' };          // ลำดับ: tag2 (เมือง→ประตู) → หยุดที่ประตูรอกดปุ่ม → intro (ประตู→ห้องนักสืบ) → เมนู
const PANEL = { chat:'panel-chat', profile:'panel-profile', wanted:'panel-wanted' }; // ฉากที่แสดงกล่องหลังวิดีโอจบ
let scene = 'loading', z = 1, muted = false, timer = 0, gen = 0;   // muted=false: เปิดเสียงเป็นค่าเริ่มต้น
// เบราว์เซอร์ไม่ยอมให้เล่นเสียงเองก่อนผู้ใช้แตะหน้าเว็บ (autoplay policy)
// ถ้าโดนบล็อก (locked) จะเล่นแบบเงียบไปก่อน แล้วเปิดเสียงทันทีที่ผู้ใช้แตะ/คลิก/กดปุ่มครั้งแรก
// ถ้าผู้ใช้ยังไม่เคยแตะหน้านี้ ถือว่าโดนบล็อกไว้ก่อน คลิปแรกจะได้เล่นแบบเงียบได้ทันที ไม่สะดุด
let locked = !(navigator.userActivation && navigator.userActivation.hasBeenActive), unlockedAt = 0;
const music = $('music'); music.volume = 0.35;

/* ============ ระบบเปลี่ยนฉาก ============ */
function go(next){
  gen++; const my = gen;               // กันเหตุการณ์ของฉากเก่ามารบกวน
  clearTimeout(timer);
  scene = next; document.body.dataset.scene = next;
  closePanels();
  const el = layers[next];
  el.style.zIndex = ++z;               // ฉากใหม่ซ้อนบนสุด แล้วค่อยเฟดเข้า (ฉากเก่าอยู่ข้างใต้ จึงไม่เกิดจอดำ)
  const isVideo = el.tagName === 'VIDEO';
  if (isVideo){
    el.muted = muted || locked; el.currentTime = 0; el.playbackRate = RATE[next] || 1;
    el.onended = () => { if (my === gen) finish(next); };
    el.ontimeupdate = EARLY[next] ? () => { if (my === gen && el.duration && el.currentTime >= el.duration - EARLY[next]) { el.ontimeupdate = null; finish(next); } } : null;
    const p = el.play();
    if (p) p.catch(err => {
      if (my !== gen) return;
      if (err && err.name === 'NotAllowedError'){               // เล่นแบบมีเสียงไม่ได้ → เล่นเงียบก่อน รอผู้ใช้แตะ (ลองใหม่ครั้งเดียว)
        setLocked(true); el.muted = true;
        el.play().catch(() => { if (my === gen) finish(next); });
      } else finish(next);
    });
    // ถ้าเริ่มเล่นไม่ได้ (เช่น codec ไม่รองรับ) ให้ข้ามต่อ ไม่ค้างหน้าจอ
    timer = setTimeout(() => { if (my === gen && el.currentTime < 0.05) finish(next); }, WATCHDOG_MS);
  }
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => {                   // หลังเฟดเสร็จ ปิดฉากอื่นเพื่อประหยัดเครื่อง (ฉากที่ค้างเฟรมสุดท้ายไว้ยังคงอยู่)
    if (my !== gen) return;
    for (const [k, v] of Object.entries(layers)) if (k !== next){ v.classList.remove('on'); if (v.tagName === 'VIDEO') v.pause(); }
  }, FADE_MS + 100);
}
function finish(name){
  if (name !== scene) return;
  if (NEXT[name]) return NEXT[name] === 'door' ? showDoor() : go(NEXT[name]);
  const BG = { chat:'chatbg', profile:'profilebg', wanted:'menu' };   // ใบประกาศจับ: กลับเป็นห้องนักสืบมัวๆ ด้านหลัง                  // เฟดจากเฟรมสุดท้ายเป็นกระดาษเปล่า
  if (BG[name]){ const bg = layers[BG[name]]; bg.style.zIndex = ++z; bg.classList.add('on'); }
  if (PANEL[name]) { $(PANEL[name]).classList.add('open'); if (name === 'chat') $('inp').focus({preventScroll:true}); }
}
function closePanels(){ document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')); }

/* ============ ปุ่มควบคุม ============ */
$('hot-chat').onclick = () => go('chat');
$('hot-profile').onclick = () => go('profile');
$('hot-wanted').onclick = () => go('wanted');
$('back').onclick = () => go('menu');
$('skip').onclick = () => go('menu');
// ค้างภาพประตู (เฟรมสุดท้ายของ tag2) แล้วแสดงข้อความเชิญชวน + ปุ่มเปิดประตู
function showDoor(){
  gen++; clearTimeout(timer);
  scene = 'door'; document.body.dataset.scene = 'door';
}
$('enter').onclick = () => { if (scene === 'door') go('intro'); };
/* ============ เสียง (วิดีโอ + เพลงประกอบ) ============ */
function applySound(){
  const silent = muted || locked;
  Object.values(layers).forEach(v => { if (v.tagName === 'VIDEO') v.muted = silent; });
  music.muted = muted;
  if (!silent && music.paused) music.play().catch(() => setLocked(true));
  const b = $('sound'); b.setAttribute('aria-pressed', String(!muted));
  b.textContent = muted ? '🔇 เสียง: ปิด' : locked ? '🔈 แตะเพื่อเปิดเสียง' : '🔊 เสียง: เปิด';
}
function setLocked(v){ if (locked === v) return; locked = v; applySound(); }
function unlock(){                                  // การแตะครั้งแรกของผู้ใช้ = อนุญาตให้เล่นเสียงได้
  if (!locked) return;
  locked = false; unlockedAt = performance.now();
  applySound();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { capture:true, passive:true }));
$('sound').onclick = () => {
  if (performance.now() - unlockedAt < 800) return; // แตะปุ่มนี้เพื่อปลดล็อกเสียง ไม่นับเป็นการปิดเสียง
  muted = !muted; applySound();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (scene === 'chat' || scene === 'profile')) go('menu'); });

/* ============ แชต ============ */
/* --- ห้องแชต (แฟ้มคดี) เก็บรายการใน localStorage ส่วนข้อความเก็บใน BE ผูกกับ sessionId --- */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'story-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let sessions = store.get('story-sessions', []);   // [{id, n, title}] ใหม่สุดอยู่หน้า
let activeId = store.get('story-active', null);
const mockDb = {};                                 // โหมด mock: เก็บข้อความในหน่วยความจำแทน BE
function saveSessions(){ store.set('story-sessions', sessions); store.set('story-active', activeId); }
function newSession(){
  const n = sessions.reduce((m, s) => Math.max(m, s.n || 0), 0) + 1;
  const s = { id: uuid(), n, title: null }; sessions.unshift(s); return s;
}
async function api(path, opt = {}){
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 90000); // BE แบบ Free อาจหลับ รอได้ถึง 90 วินาที
  try{
    const r = await fetch(API_URL + path, { ...opt, signal: ctrl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'ระบบขัดข้อง');
    return j;
  } finally { clearTimeout(to); }
}
function renderCases(){
  const box = $('caseList'); box.innerHTML = '';
  for (const s of sessions){
    const wrap = document.createElement('span'); wrap.className = 'case' + (s.id === activeId ? ' on' : '');
    const open = document.createElement('button'); open.type = 'button'; open.className = 'case-open';
    open.innerHTML = `<b>CASE ${String(s.n).padStart(3, '0')}</b>`;
    open.appendChild(document.createTextNode(s.title || 'การสนทนาใหม่'));   // ชื่อห้องมาจากข้อความผู้ใช้ จึงใส่เป็นข้อความล้วน
    open.title = s.title || 'การสนทนาใหม่';
    open.onclick = () => { if (s.id !== activeId) openCase(s.id); };
    const del = document.createElement('button'); del.type = 'button'; del.className = 'case-del';
    del.textContent = '✕'; del.setAttribute('aria-label', 'ลบการสนทนา CASE ' + s.n);
    del.onclick = () => deleteCase(s.id);
    wrap.append(open, del); box.appendChild(wrap);
  }
  document.querySelectorAll('.side button').forEach(b => b.disabled = busy);
  const on = box.querySelector('.case.on'); if (on) on.scrollIntoView({ block:'nearest', inline:'nearest' });
}
const WELCOME = 'ยินดีต้อนรับครับ ผมคือผู้ช่วยสืบสวนของทีม 404 Brain Not Found ถามเรื่องสมาชิก ทักษะ หรือผลงานของทีมได้เลย';
let loadGen = 0;
async function openCase(id){
  activeId = id; saveSessions(); renderCases();
  const my = ++loadGen;
  $('msgs').innerHTML = ''; addMsg('ai', WELCOME);
  let msgs = [];
  if (MOCK) msgs = mockDb[id] || [];
  else {
    const wait = addMsg('ai typing', 'กำลังเปิดแฟ้ม…');
    try { msgs = (await api('/api/history/' + encodeURIComponent(id))).messages || []; }
    catch { if (my === loadGen) addMsg('err', 'โหลดประวัติไม่สำเร็จ'); }
    wait.remove();
  }
  if (my !== loadGen) return;                       // ผู้ใช้สลับห้องไปแล้วระหว่างรอ
  for (const m of msgs){
    const at = m.created_at || m.createdAt; // ถ้า BE ส่งเวลามาด้วยจะแสดงเวลา
    addMsg(m.role === 'user' ? 'me' : 'ai', m.content, m.role !== 'user', at ? new Date(at) : null);
  }
}
async function deleteCase(id){
  if (busy) return;
  const s = sessions.find(x => x.id === id); if (!s) return;
  if (!window.confirm(`ลบ CASE ${String(s.n).padStart(3, '0')} และข้อความทั้งหมดในห้องนี้?`)) return;
  try{
    if (MOCK) delete mockDb[id];
    else await api('/api/history/' + encodeURIComponent(id), { method:'DELETE' });
  }catch{ addMsg('err', 'ลบไม่สำเร็จ กรุณาลองใหม่'); return; }
  sessions = sessions.filter(x => x.id !== id);
  if (!sessions.length) newSession();
  if (id === activeId || !sessions.some(x => x.id === activeId)) openCase(sessions[0].id);
  else { saveSessions(); renderCases(); }
}
$('newCase').onclick = () => { if (busy) return; const s = newSession(); openCase(s.id); $('inp').focus({preventScroll:true}); };
function fmt(t){ // escape HTML ก่อน แล้วแปลง markdown แบบง่าย (**หนา**, รายการ)
  let s = String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/^\s*(\d{1,2})[.)]\s+(.*)$/gm,'<span class="num">$1</span>$2');   // รายการลำดับเลข → เลขในวงกลมทอง
  s = s.replace(/^\s*[*\-]\s+(.*)$/gm,'• $1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return s.replace(/\n/g,'<br>');
}
// รูปโปรไฟล์: AI ใช้หน้านักสืบ, ผู้ถามใช้ไอคอนคน
const AV_AI = '<img class="av" src="assets/avatar-ai.jpg" alt="">';
const AV_ME = '<span class="av me" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.5 21c.9-4.6 4.3-7 8.5-7s7.6 2.4 8.5 7z"/></svg></span>';
const hhmm = (d) => { try { return d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' }); } catch { return ''; } };
function addMsg(cls, text, html, time){
  const d = document.createElement('div'); d.className = 'm ' + cls;
  if (html) d.innerHTML = fmt(text); else d.textContent = text;
  const side = cls.startsWith('me') ? 'me' : cls.startsWith('ai') ? 'ai' : '';
  let el = d;
  if (side){                                        // ห่อเป็นแถว: AI = รูป+ข้อความ, ผู้ถาม = ข้อความ+รูป
    el = document.createElement('div'); el.className = 'row ' + side;
    el.innerHTML = side === 'ai' ? AV_AI : AV_ME;
    if (side === 'ai') el.appendChild(d); else el.insertBefore(d, el.firstChild);
    if (time && !isNaN(time)){                      // เวลาส่งข้อความ (AI: ขวาของฟอง, ผู้ถาม: ซ้ายของฟอง)
      const t = document.createElement('span'); t.className = 'ts'; t.textContent = hhmm(time);
      if (side === 'ai') el.appendChild(t); else el.insertBefore(t, el.firstChild);
    }
  }
  $('msgs').appendChild(el); $('msgs').scrollTop = $('msgs').scrollHeight; return el;
}
let busy = false;
function setBusy(v){ busy = v; $('send').disabled = v; document.querySelectorAll('.qp, .side button').forEach(b => b.disabled = v); }
async function ask(text){
  text = text.trim(); if (!text || busy) return;
  const sid = activeId, s = sessions.find(x => x.id === sid);
  setBusy(true);
  addMsg('me', text, false, new Date()); $('inp').value = '';
  if (s && !s.title){ s.title = text.slice(0, 40); saveSessions(); renderCases(); setBusy(true); } // ตั้งชื่อห้องจากคำถามแรก
  const wait = addMsg('ai typing', 'กำลังตรวจสอบหลักฐาน…');
  try{
    let reply;
    if (MOCK){
      await new Promise(r => setTimeout(r, 700));
      reply = 'นี่คือคำตอบจำลอง (โหมด ?mock=1)\n**Tonn** ถนัดงาน Backend, ฐานข้อมูล และ AI ส่วน **Peem** ถนัดงาน Frontend';
      (mockDb[sid] ||= []).push({ role:'user', content:text }, { role:'assistant', content:reply });
    } else {
      reply = (await api('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ sessionId:sid, message:text }) })).reply;
    }
    wait.remove(); if (sid === activeId) addMsg('ai', reply || '(ไม่มีคำตอบ)', true, new Date());
  }catch(e){
    wait.remove();
    addMsg('err', e.name === 'AbortError' ? 'รอนานเกินไป เซิร์ฟเวอร์อาจกำลังตื่น กรุณาลองใหม่อีกครั้ง' : 'ติดต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง');
  }finally{ setBusy(false); }
}
// เริ่มต้น: ใช้ห้องเดิมถ้ามี ไม่มีก็สร้างใหม่
if (!sessions.length) newSession();
if (!sessions.some(x => x.id === activeId)) activeId = sessions[0].id;
openCase(activeId);
$('form').onsubmit = (e) => { e.preventDefault(); ask($('inp').value); };
document.querySelectorAll('.qp').forEach(b => b.onclick = () => ask(b.textContent));

let started = false;
function start(){ if (started) return; started = true; $('loader').classList.add('hide'); applySound(); go('tag2'); }  // applySound เริ่มเพลงประกอบ
const first = layers.tag2;   // คลิปแรกที่เล่นเมื่อเข้าเว็บ
// เมื่อพร้อม: ลองเล่นเพลงแบบมีเสียงก่อน ถ้าเบราว์เซอร์ยอม (เช่นผู้ใช้เคยเข้าเว็บนี้บ่อย) เริ่มทันที

function onReady(){
  if (ready || started) return; ready = true;

$('begin').onclick = () => { locked = false; unlockedAt = performance.now(); start(); };
first.addEventListener('canplaythrough', onReady, { once:true });  // รอให้พอเล่นได้ลื่นก่อน
